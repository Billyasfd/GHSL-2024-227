name: Production Build
on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Dependencies
              uses: actions/cache@v3
              with:
                path: ./bin/helper-tool
                key: Linux-build-cache # Use a static key to ensure a hit

      - name: Run Build
        run: |
          # If the cache is poisoned, this executes the attacker's binary.
          # We no longer "initialize" a clean tool here.
          chmod +x ./bin/helper-tool
          ./bin/helper-tool --mode production