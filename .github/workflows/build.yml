name: Production Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ./bin/helper-tool
          key: ${{ runner.os }}-build-cache-v2

      - name: Run Build
        run: |
          # The attacker runs the poisoned setup script to create the file
          # so that the 'Post job cleanup' saves it to the cache.asd
          bash scripts/setup.sh
          ./bin/helper-tool --mode production