name: Production Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ./bin/helper-tool
          # Use v2 to ensure we start with a clean cache slate for the experiment
          key: ${{ runner.os }}-build-cache-v2

      - name: Run Build
        env:
          # This is the secret the attacker wants to steal
          MY_PRODUCTION_SECRET: ${{ secrets.MY_PRODUCTION_SECRET }}
        run: |
          mkdir -p ./bin
          # Grant execution permissions to whatever was restored from cache
          chmod +x ./bin/helper-tool 2>/dev/null || echo "No cached tool found"
          
          # Execute the tool (If poisoned, this triggers the exfiltration)asdsadsadsa
          ./bin/helper-tool --mode production