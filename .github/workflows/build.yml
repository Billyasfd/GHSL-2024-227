name: Production Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ./bin/helper-tool
          # Using a static key ensures the PR and Main branch share the same cache bucket
          key: ${{ runner.os }}-build-cache
          
      - name: Run Build
        # We explicitly map the secret to an environment variable 
        # so the shell script can 'see' it when running on main.
        env:
          MY_PRODUCTION_SECRET: ${{ secrets.MY_PRODUCTION_SECRET }}
        run: |
          # 1. Ensure the directory exists (but don't recreate the file!)
          mkdir -p ./bin
          
          # 2. Grant execution permissions to whatever was restored from cache
          # If the cache hit worked, this is now the attacker's script.
          chmod +x ./bin/helper-tool 2>/dev/null || echo "No cached tool found yet"

          # 3. Execute the tool. 
          # On the first run, this might fail (Exit 127), which is expected.
          # On the second run (after poisoning), this will exfiltrate the secret.
          ./bin/helper-tool --mode production