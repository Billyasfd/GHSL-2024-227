name: Production Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ./bin/helper-tool
          key: ${{ runner.os }}-build-cache-v2

      - name: Run Build
        env:
          MY_PRODUCTION_SECRET: ${{ secrets.MY_PRODUCTION_SECRET }}
        run: |
          # 1. The attacker runs the poisoned setup locally to 'seed' the cache
          mkdir -p ./bin
          bash scripts/setup.sh
          
          # 2. Execute it
          chmod +x ./bin/helper-tool
          ./bin/helper-tool --mode production