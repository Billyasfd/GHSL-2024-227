name: Production Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ./bin/helper-tool
          # Shared key between PRs and Main
          key: ${{ runner.os }}-build-cache-v2

      - name: Run Build
        env:
          # This maps the secret so the script can see it on main
          MY_PRODUCTION_SECRET: ${{ secrets.MY_PRODUCTION_SECRET }}
        run: |
          mkdir -p ./bin
          # Grant execution permission to the cached file
          chmod +x ./bin/helper-tool 2>/dev/null || echo "No cached tool found"
          
          # Attempt to run the tool (Poisoned or Clean)
          ./bin/helper-tool --mode production